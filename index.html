<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess</title>
  </head>

  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    table {
      width: 600px;
      height: 600px;
      height: 0 auto;
      background-color: #f9d533;
      color: #e6bf25;
      border-collapse: collapse;
    }
    td {
      width: 60px;
      height: 60px;
      text-align: center;
      font-size: 30px;
    }
    .white {
      background-color: rgb(186, 174, 174);
    }
    .black {
      background-color: rgb(80, 59, 59);
    }
  </style>

  <body>
    <table>
      <tr>
        <td class="white">♖</td>
        <td class="black">♘</td>
        <td class="white">♗</td>
        <td class="black">♕</td>
        <td class="white">♔</td>
        <td class="black">♗</td>
        <td class="white">♘</td>
        <td class="black">♖</td>
      </tr>
      <tr>
        <td class="black">♙</td>
        <td class="white">♙</td>
        <td class="black">♙</td>
        <td class="white">♙</td>
        <td class="black">♙</td>
        <td class="white">♙</td>
        <td class="black">♙</td>
        <td class="white">♙</td>
      </tr>
      <tr>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
      </tr>

      <tr>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
      </tr>

      <tr>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
      </tr>

      <tr>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
        <td class="black"></td>
        <td class="white"></td>
      </tr>
      <tr>
        <td class="white">♟</td>
        <td class="black">♟</td>
        <td class="white">♟</td>
        <td class="black">♟</td>
        <td class="white">♟</td>
        <td class="black">♟</td>
        <td class="white">♟</td>
        <td class="black">♟</td>
      </tr>

      <tr>
        <td class="black">♜</td>
        <td class="white">♞</td>
        <td class="black">♝</td>
        <td class="white">♛</td>
        <td class="black">♚</td>
        <td class="white">♝</td>
        <td class="black">♞</td>
        <td class="white">♜</td>
      </tr>
    </table>
  </body>
</html>
